<!DOCTYPE html>
<html>
<head>
  <title>Nero.io Map Editor</title>

  <style>

    body {
      margin: 0;
      font-family: Arial;
      background: #ececec;
      color: white;

      display: flex;
      height: 100vh;
            background-image: url("https://deltafyrex.github.io/neroassets/nero-logo-text.png?v=1746742162513");

      overflow: hidden;
    }

    #editorArea {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
      overflow: hidden;
    }

    #leftPanel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;

    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    #controls input {
      width: 70px;
      padding: 5px;
      font-size: 16px;
    }

    #controls button {
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    #mainContent {
      flex: 1;
      display: flex;
      gap: 20px;
      min-height: 0;
    }

    #gridContainer {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    #grid {
      display: grid;

      width: min(65vw, calc(100vh - 160px));
      height: min(65vw, calc(100vh - 160px));

      background: #F0F7FA;

      border: 2px solid white;
        outline: 2px solid black; /* Outer outline */


      flex-shrink: 0;
    }

    .cell {
      border: 1px solid #888;
      cursor: pointer;
      box-sizing: border-box;

      user-select: none;
      -webkit-user-drag: none;
    }

    #jsonPanel {
      flex: 1;
      background-color: "#DDE6EB";

      display: flex;
      flex-direction: column;

      min-width: 250px;
      min-height: 0;


    }

    #jsonPanel h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    textarea {
      flex: 1;

      width: 100%;

      font-family: monospace;
      font-size: 14px;

      resize: none;

      padding: 10px;

      box-sizing: border-box;

                  border: 2px solid white;
        outline: 2px solid black; /* Outer outline */
    }

    #toolbar {
      width: 240px;

      background: #222;
      color: white;

      padding: 20px;

      display: flex;
      flex-direction: column;

      gap: 12px;

      overflow-y: auto;

      flex-shrink: 0;
    }

    #toolbar h2 {
      margin-top: 0;
    }

    .toolButton {
      padding: 14px;

      border: none;
      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;
      font-weight: bold;

      transition: transform 0.1s;
    }

    .toolButton:hover {
      transform: scale(1.03);
    }

    .selectedTool {
      outline: 4px solid yellow;
    }

      a.menuTab {
    float: right;
    height: 13px;
    font: 13px "Black Ops One";
    border-radius: 0px 0px 5px 5px;
    padding: 6px 10px 7px 10px;
    color: #FFFFFF !important;
    text-decoration: none;
    margin-right: 10px;
    top: 0;
    right: 0;
  }
  a.menuTab.discordbutton {
     padding: 6px 10px 7px 28px;
          border-bottom: 2px solid #6175ba;
      box-shadow: inset 0 -2px #6175ba;
      -webkit-box-shadow: inset 0 -2px #6175ba;
        animation:pfpDefault 800ms linear both;
    background: #7289DA url("https://deltafyrex.github.io/neroassets4/discord-white-icon.webp") 4px 3px/21px no-repeat;
  }
  a.menuTab.discordbutton:active,
  a.menuTab.discordbutton:hover {
      outline: none;
      -webkit-box-shadow: none;
      box-shadow: none;
  }
  a.menuTab.catto {
    background: #FF0000 url("https://cloud-cube.s3.amazonaws.com/m660o440l0wv/public/coder.png") 8px 6px no-repeat;
    padding: 6px 10px 7px 28px;
        border-bottom: 2px solid #c91a1a;
      box-shadow: inset 0 -2px #c91a1a;
      -webkit-box-shadow: inset 0 -2px #c91a1a;
        animation:pfpDefault 800ms linear both;
  }
  a.menuTab.catto:active,
  a.menuTab.catto:hover {
      outline: none;
      -webkit-box-shadow: none;
      box-shadow: none;
  }
  body.mobile a.menuTab.catto {
  display: none;
  }
  
  a.menuTab.ach {
    background: #2bab2f  url("https://deltafyrex.github.io/neroassets/Trophy.png?v=1708025693434") 3px 2px/23px no-repeat;
    padding: 6px 10px 7px 28px;
    border-bottom: 2px solid #2a802d;
    box-shadow: inset 0 -2px #2a802d;
    -webkit-box-shadow: inset 0 -2px #2a802d;
    animation:pfpDefault 800ms linear both;
  }
  a.menuTab.ach:active,
  a.menuTab.ach:hover {
      top: 1px;
      outline: none;
      -webkit-box-shadow: none;
      box-shadow: none;
  }
  
  a.menuTab.skin {
    background: #9900FF  url("https://deltafyrex.github.io/neroassets2/stick.png?v=1708440293253") 3px 2px/23px no-repeat;
    padding: 6px 10px 7px 28px;
          border-bottom: 2px solid #7b11c2;
      box-shadow: inset 0 -2px #7b11c2;
      -webkit-box-shadow: inset 0 -2px #7b11c2;
        animation:pfpDefault 800ms linear both;
  }
  a.menuTab.skin:active,
  a.menuTab.skin:hover {
      top: 1px;
      outline: none;
      -webkit-box-shadow: none;
      box-shadow: none;
  }
  
  a.menuTab.stat {
    background: #1E8449  url("https://cloud-cube.s3.amazonaws.com/m660o440l0wv/public/play.png") 3px 2px/23px no-repeat;
    padding: 6px 10px 7px 28px;
          border-bottom: 2px solid #156637;
      box-shadow: inset 0 -2px #156637;
      -webkit-box-shadow: inset 0 -2px #156637;
        animation:pfpDefault 800ms linear both;
  }
  a.menuTab.stat:active,
  a.menuTab.stat:hover {
      top: 1px;
      outline: none;
      -webkit-box-shadow: none;
      box-shadow: none;
  }
  body.mobile a.menuTab.stat {
  display: none;
  }
  a.menuTab:link:hover, a.menuTab:visited:hover {
    text-decoration: underline;
      animation:pfpHoverOn 800ms linear both;
  }

  </style>
</head>
<body>

  <div id="editorArea">

              <div style="position: absolute" class="menuTabs">
        <a class="menuTab discordbutton" onclick="Discordjoin()" onmouseover="PlaySound1()" title="Join the Nero.io Discord server!" href="https://discord.gg/jeDnGsj4MM" target="_blank" rel="noopener noreferrer">Nero.io Discord</a>
        <a class="menuTab ach" onclick="displayAchievements()" onmouseover="PlaySound1()" title="View Game Achievements" href="javascript:void(0)">Info</a>
        <a class="menuTab skin" onclick="displaySkins()" onmouseover="PlaySound1()" title="View Game Skins" href="javascript:void(0)">Tile Guide (Click to see what each tile does)</a>
        </div>

    <div id="leftPanel">



      <h1>Nero.io Map Editor</h1>

      <div id="controls">

        <label>
          Width:
          <input type="number" id="widthInput" value="11" min="1">

        <label>
          Height:

      <div id="mainContent">

        </div>

        <div id="jsonPanel">

          <h2>Generated Map</h2>

          <textarea id="output"></textarea>

        </div>

      </div>

    </div>

  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">

    <h2>Risk Tiles</h2>

    <!-- Capture Point -->
    <button class="toolButton"
            style="background:#F0F7FA; color:black;"

    <!-- FOOD -->

            onclick="selectTile('blrd', 'blackroid', this)">

    </button>

    <button class="toolButton"
            style="background: black; color: white"
            onclick="selectTile('blrk', 'blackrock', this)">
      ▣ Black Rock Tile
    </button>

    <button class="toolButton"
            style="background: linear-gradient(90deg, red, orange, yellow, green, blue, purple);"
            onclick="selectTile('dcf0', 'rainbow', this)">
      Rainbow
    </button>

    <button class="toolButton"
            style="background: blue;"
            onclick="selectTile('dcf1', 'flashBlueRed', this)">
      Blue/Red
    </button>

    <button class="toolButton"
            style="background: cyan;"
            onclick="selectTile('dcf2', 'flashBlueGray', this)">
      Blue/Gray
    </button>

    <button class="toolButton"
            style="background: lightblue;"
            onclick="selectTile('dcf3', 'flashGreyBlue', this)">
      Gray/Blue
    </button>

            style="background: red;"
            onclick="selectTile('dcf4', 'flashRedGrey', this)">
      Red/Gray
    </button>

            style="background: pink;"
            onclick="selectTile('dcf5', 'flashGreyRed', this)">
      Gray/Red
    </button>

    <button class="toolButton"
            style="background: #fc4e51;"
            onclick="selectTile('sibs', '#fc4e51', this)">
      Siege Boss Spawn
    </button>

        <button class="toolButton"
            style="background: #fceded;"
            onclick="selectTile('atmg', '#fceded', this)">
      AntiTank Machine Gun
    </button>

    <!-- EMPTY -->
    <button class="toolButton selectedTool"
            style="background:#F0F7FA; color:black;"
            onclick="selectTile('F___', '#F0F7FA', this)">
      Empty
    </button>

  </div>

  <script>

    let room = [];

    let currentTile = "F___";
    let currentColor = "#F0F7FA";

    let mouseDown = false;
    let eraseMode = false;

    let fillStart = null;

    let undoStack = [];
    let redoStack = [];

let myVariable = true;
const checkbox = document.querySelector('#myCheckbox');

checkbox.addEventListener('change', (event) => {
  myVariable = event.target.checked; // Sets variable to true or false
});

    const tileColors = {

      "F___": "#F0F7FA",

      "WALL": "#959597",

      "____": "#f0f4c5",

      "roid": "roidtile",

      "rock": "rocktile",

      "watr": "#7efff0",

      "nest": "#E0E1F4",

      "sped": "#ffbf7e",

      "sblu": "teamBlueSpawn",

      "sgre": "teamRedSpawn",

      "cont": "neutralSpawn",

      "ucon": "controlPoint1",

      "uco2": "controlPoint2",

      "UWAL": "softPoint1",

      "UWA2": "softPoint2",

      "port": "#5f5f5f",

      "t1tr": "#c4d7e4",

      "t2tr": "#e5c8cb",

      "blat": "#000000",

      "blrd": "blackroid",

      "blrk": "blackrock",

      "dcf0": "rainbow",

      "dcf1": "flashBlueRed",

      "dcf2": "flashBlueGray",

      "dcf3": "flashGreyBlue",

      "dcf4": "flashRedGrey",

      "dcf5": "flashGreyRed",

      "sibs": "#fc4e51",
      
      "atmg": "antitankminigun",

    };

    function saveState() {

      undoStack.push(JSON.stringify(room));

      if (undoStack.length > 100) {
        undoStack.shift();
      }

      redoStack = [];
    }

    function undo() {

      if (undoStack.length === 0) return;

      redoStack.push(JSON.stringify(room));

      room = JSON.parse(undoStack.pop());

      rebuildGrid();
    }

    function redo() {

      if (redoStack.length === 0) return;

      undoStack.push(JSON.stringify(room));

      room = JSON.parse(redoStack.pop());

      rebuildGrid();
    }

    document.addEventListener("keydown", (event) => {

      if (event.ctrlKey && event.key.toLowerCase() === "z") {

        event.preventDefault();

        undo();
      }

      if (event.ctrlKey && event.key.toLowerCase() === "y") {

        event.preventDefault();

        redo();
      }

    });

    document.body.addEventListener("mousedown", (event) => {

      mouseDown = true;

      eraseMode = (event.button === 2);

    });

    document.body.addEventListener("mouseup", () => {

      mouseDown = false;

      eraseMode = false;

      fillStart = null;

    });

    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    function selectTile(tileName, color, button) {

      currentTile = tileName;
      currentColor = color;

      const buttons = document.querySelectorAll(".toolButton");

      buttons.forEach(btn => {
        btn.classList.remove("selectedTool");
      });

      button.classList.add("selectedTool");
    }

    function setSpawnTile(cell, color) {

      cell.style.background = color;

      cell.innerHTML = `
        <div style="
          position:absolute;
          inset:0;

          display:flex;
          align-items:center;
          justify-content:center;

          pointer-events:none;

          font-size:65%;
          font-weight:bold;

          color:black;
        ">
          ⬡
        </div>
      `;

      cell.style.position = "relative";

      cell.style.overflow = "hidden";
    }

    function setControlPointTile(cell, number) {

      cell.innerHTML = `
        <div style="
          position:absolute;
          inset:0;

          display:flex;
          align-items:center;
          justify-content:center;

          pointer-events:none;

          font-size:85%;
          font-weight:bold;

          color:black;

          text-shadow:
            1px 1px 0 white,
           -1px -1px 0 white,
            1px -1px 0 white,
           -1px 1px 0 white;
        ">
          ${number}
        </div>
      `;

      cell.style.position = "relative";

      cell.style.overflow = "hidden";
    }

    function setSoftPointTile(cell, number) {

      cell.style.background = "#cacacb";

      cell.innerHTML = `
        <div style="
          position:absolute;
          inset:0;

          display:flex;
          align-items:center;
          justify-content:center;

          pointer-events:none;

          font-size:85%;
          font-weight:bold;

          color:black;
        ">
          ${number}
        </div>
      `;

      cell.style.position = "relative";

      cell.style.overflow = "hidden";
    }

        function setSoftPointTileblack(cell, number, color, textcolor) {


      cell.innerHTML = `
        <div style="
          position:absolute;
          inset:0;

          display:flex;
          align-items:center;
          justify-content:center;

          pointer-events:none;

          font-size:85%;
          font-weight:bold;

          color:${textcolor ?? "white"};
        ">
          ${number}
        </div>
      `;

      cell.style.background = color,

      cell.style.position = "relative";

      cell.style.overflow = "hidden";
    }

    function paintTile(cell, x, y) {

      room[y][x] = currentTile;

      if (currentTile === "sblu") {

        setSpawnTile(cell, "#CAE4F6");

        return;
      }

      if (currentTile === "sgre") {

        setSpawnTile(cell, "#F3CED1");

        return;
      }

      if (currentTile === "cont") {

        setSpawnTile(cell, "#F0F7FA");

        return;
      }

      if (currentTile === "ucon") {

        setControlPointTile(cell, "1");

        return;
      }

      if (currentTile === "uco2") {

        setControlPointTile(cell, "2");

        return;
      }

      if (currentTile === "UWAL") {

        setSoftPointTile(cell, "1");

        return;
      }

      if (currentTile === "UWA2") {

        setSoftPointTile(cell, "2");

        return;
      }

      if (currentTile === "roid") {

        setSoftPointTileblack(cell, "□", "#bababa");

        return;
      }

      if (currentTile === "rock") {

        setSoftPointTileblack(cell, "▣", "#bababa");

        return;
      }

      if (currentTile === "blrd") {

        setSoftPointTileblack(cell, "□", "black");

        return;
      }

      if (currentTile === "blrk") {

        setSoftPointTileblack(cell, "▣", "black");

        return;
      }

      if (currentTile === "atmg") {

        setSoftPointTileblack(cell, "🥆", "#fceded", "black");

        return;
      }

      cell.innerHTML = "";

      cell.style.position = "";
      cell.style.overflow = "";

      cell.style.background = currentColor;
    }

    function rebuildGrid() {

      const height = room.length;
      const width = room[0].length;

      const grid = document.getElementById("grid");

      grid.innerHTML = "";

      grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${height}, 1fr)`;

      for (let y = 0; y < height; y++) {

        for (let x = 0; x < width; x++) {

          const cell = document.createElement("div");

          cell.classList.add("cell");

          const tile = room[y][x];

          const color = tileColors[tile] || "magenta";

          if (tile === "sblu") {

            setSpawnTile(cell, "#CAE4F6");
          }

          else if (tile === "sgre") {

            setSpawnTile(cell, "#F3CED1");
          }

          else if (tile === "cont") {

            setSpawnTile(cell, "#F0F7FA");
          }

          else if (tile === "ucon") {

            setControlPointTile(cell, "1");
          }

          else if (tile === "uco2") {

            setControlPointTile(cell, "2");
          }

          else if (tile === "UWAL") {

            setSoftPointTile(cell, "1");
          }

          else if (tile === "UWA2") {

            setSoftPointTile(cell, "2");
          }

          else if (tile === "roid") {

            setSoftPointTileblack(cell, "□", "#bababa");
          }

          else if (tile === "rock") {

            setSoftPointTileblack(cell, "▣", "#bababa");
          }

          else if (tile === "blrd") {

            setSoftPointTileblack(cell, "□", "black");
          }

          else if (tile === "blrk") {

            setSoftPointTileblack(cell, "▣", "black");
          }
                    else if (tile === "atmg") {


                  setSoftPointTileblack(cell, "🥆", "#fceded", "black");
        }

          else if (
            !color.includes("dancefloor") &&
            color !== "rainbow"
          ) {

            cell.style.background = color;

            cell.innerHTML = "";
          }

          attachCellEvents(cell, x, y);

          grid.appendChild(cell);
        }
      }
    }

    function fillRectangle(endX, endY) {

      if (!fillStart) return;

      const startX = fillStart.x;
      const startY = fillStart.y;

      const minX = Math.min(startX, endX);
      const maxX = Math.max(startX, endX);

      const minY = Math.min(startY, endY);
      const maxY = Math.max(startY, endY);

      const cells = document.querySelectorAll(".cell");

      const width = room[0].length;

      for (let y = minY; y <= maxY; y++) {

        for (let x = minX; x <= maxX; x++) {

          room[y][x] = currentTile;

          const index = y * width + x;

          const cell = cells[index];

          if (currentTile === "sblu") {

            setSpawnTile(cell, "#CAE4F6");
          }

          else if (currentTile === "sgre") {

            setSpawnTile(cell, "#F3CED1");
          }

          else if (currentTile === "cont") {

            setSpawnTile(cell, "#F0F7FA");
          }

          else if (currentTile === "ucon") {

            setControlPointTile(cell, "1");
          }

          else if (currentTile === "uco2") {

            setControlPointTile(cell, "2");
          }

          else if (currentTile === "UWAL") {

            setSoftPointTile(cell, "1");
          }

          else if (currentTile === "UWA2") {

            setSoftPointTile(cell, "2");
          }

          else if (currentTile === "roid") {

            setSoftPointTileblack(cell, "□", "#bababa");
          }

          else if (currentTile === "rock") {

            setSoftPointTileblack(cell, "▣", "#bababa");
          }

          else if (currentTile === "blackroid") {

            setSoftPointTileblack(cell, "□", "black");
          }

          else if (currentTile === "blackrock") {

            setSoftPointTileblack(cell, "▣", "black");
          }

          else {

            cell.innerHTML = "";

            cell.style.position = "";
            cell.style.overflow = "";

            cell.style.background = currentColor;
          }
        }
      }
    }

    function attachCellEvents(cell, x, y) {

      cell.addEventListener("mousedown", (event) => {

        event.preventDefault();

        saveState();

        if (event.button === 2) {

          room[y][x] = myVariable ? "cont" : "F___";

          cell.style.background = "#F0F7FA";          

          cell.innerHTML = myVariable ? `
        <div style="
          position:absolute;
          inset:0;

          display:flex;
          align-items:center;
          justify-content:center;

          pointer-events:none;

          font-size:65%;
          font-weight:bold;

          color:black;
        ">
          ⬡
        </div>
      ` : "";

          cell.style.position = myVariable ? "relative" : "";
          cell.style.overflow = myVariable ? "hidden" : "";

          return;
        }

        if (event.shiftKey) {

          fillStart = { x, y };

        } else {

          paintTile(cell, x, y);
        }

      });

      cell.addEventListener("mouseover", (event) => {

        event.preventDefault();

        if (mouseDown && eraseMode) {

          room[y][x] = myVariable ? "cont" : "F___";

          cell.style.background = "#F0F7FA";
                    
          cell.style.position = "relative";

          cell.style.overflow = "hidden";

          cell.innerHTML = myVariable ? `
        <div style="
          position:absolute;
          inset:0;

          display:flex;
          align-items:center;
          justify-content:center;

          pointer-events:none;

          font-size:65%;
          font-weight:bold;

          color:black;
        ">
          ⬡
        </div>
      ` : "";

          cell.style.position = myVariable ? "relative" : "";
          cell.style.overflow = myVariable ? "hidden" : "";

          return;
        }

        if (mouseDown && fillStart && event.shiftKey) {

          fillRectangle(x, y);

        }

        else if (mouseDown && !fillStart) {

          paintTile(cell, x, y);
        }

      });

      cell.addEventListener("mouseup", (event) => {

        if (fillStart && event.shiftKey) {

          fillRectangle(x, y);

          fillStart = null;
        }

      });

    }

function createGrid() {

  const width = parseInt(document.getElementById("widthInput").value);
  const height = parseInt(document.getElementById("heightInput").value);

  room = [];

  for (let y = 0; y < height; y++) {

    room[y] = [];

    for (let x = 0; x < width; x++) {

      const isBorder =
        x === 0 ||
        y === 0 ||
        x === width - 1 ||
        y === height - 1;

      if (isBorder) {

        room[y][x] =
          myVariable ? "WALL" : "F___";

      } else {

        room[y][x] =
          myVariable ? "cont" : "F___";
      }
    }
  }

  rebuildGrid();
}

    function generateJSON() {

      let output = "room = [\n";

      for (let y = 0; y < room.length; y++) {

        output += "    [";

        for (let x = 0; x < room[y].length; x++) {

          output += room[y][x];

          if (x < room[y].length - 1) {
            output += ",";
          }

        }

        output += "]";

        if (y < room.length - 1) {
          output += ",";
        }

        output += "\n";
      }

      output += "];";

      document.getElementById("output").value = output;
    }

    function importJSON() {

      try {

        let text = document.getElementById("output").value;

        text = text.replace("room =", "").trim();

        text = text.replace(";", "");

text = text.replace(/\b([a-zA-Z0-9_]+)\b/g, '"$1"');
        room = JSON.parse(text);

        document.getElementById("widthInput").value =
          room[0].length;

        document.getElementById("heightInput").value =
          room.length;

        rebuildGrid();

      } catch (error) {

        alert("Invalid room data!");

        console.error(error);

      }
    }

    function animateTiles() {

      const cells = document.querySelectorAll(".cell");

      if (room.length === 0) {

        requestAnimationFrame(animateTiles);

        return;
      }

      const width = room[0].length;

      const time = Date.now();

      for (let y = 0; y < room.length; y++) {

        for (let x = 0; x < room[y].length; x++) {

          const tile = room[y][x];

          const index = y * width + x;

          const cell = cells[index];

          if (!cell) continue;

          // RAINBOW
          if (tile === "dcf0") {

            const hue =
              (time / 10 + (x + y) * 20) % 360;

            cell.style.background =
              `hsl(${hue}, 100%, 50%)`;
          }

          // BLUE / RED
          else if (tile === "dcf1") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "blue" : "red";
          }

          // BLUE / GRAY
          else if (tile === "dcf2") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "blue" : "gray";
          }

          // GRAY / BLUE
          else if (tile === "dcf3") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "gray" : "blue";
          }

          // RED / GRAY
          else if (tile === "dcf4") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "red" : "gray";
          }

          // GRAY / RED
          else if (tile === "dcf5") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "gray" : "red";
          }

          // CONTROL POINTS
          else if (
            tile === "ucon" ||
            tile === "uco2"
          ) {

            const speed = 550;

            const phase =
              Math.floor(time / speed) % 4;

            if (phase === 0) {

              cell.style.background = "#f6dede";
            }

            else if (phase === 1) {

              cell.style.background = "#F0F7FA";
            }

            else if (phase === 2) {

              cell.style.background = "#dcecf8";
            }

            else {

              cell.style.background = "#F0F7FA";
            }
          }

        }
      }

      requestAnimationFrame(animateTiles);
    }

    createGrid();

    animateTiles();

  </script>
