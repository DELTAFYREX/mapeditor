<!DOCTYPE html>
<html>
<head>
  <title>Nero.io Map Editor</title>

  <style>

    body {
      margin: 0;
      font-family: Arial;
      background: #ececec;

      display: flex;
      height: 100vh;

      overflow: hidden;
    }

    /* MAIN AREA */
    #editorArea {
      flex: 1;

      display: flex;

      padding: 20px;
      gap: 20px;

      overflow: hidden;
    }

    /* LEFT SIDE */
    #leftPanel {
      flex: 1;

      display: flex;
      flex-direction: column;

      min-width: 0;
    }

    /* CONTROLS */
    #controls {
      display: flex;
      flex-wrap: wrap;

      align-items: center;

      gap: 10px;

      margin-bottom: 15px;
    }

    #controls input {
      width: 70px;

      padding: 5px;

      font-size: 16px;
    }

    #controls button {
      padding: 8px 12px;

      font-size: 14px;

      cursor: pointer;
    }

    /* MAIN CONTENT */
    #mainContent {
      flex: 1;

      display: flex;

      gap: 20px;

      min-height: 0;
    }

    /* GRID SIDE */
    #gridContainer {
      display: flex;

      align-items: flex-start;
      justify-content: flex-start;
    }

    /* GRID */
    #grid {
      display: grid;

      width: min(65vw, calc(100vh - 160px));
      height: min(65vw, calc(100vh - 160px));

      background: white;

      border: 2px solid black;

      flex-shrink: 0;
    }

    .cell {
      border: 1px solid #888;

      cursor: pointer;

      box-sizing: border-box;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* JSON PANEL */
    #jsonPanel {
      flex: 1;

      display: flex;
      flex-direction: column;

      min-width: 250px;
      min-height: 0;
    }

    #jsonPanel h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    /* JSON BOX */
    textarea {
      flex: 1;

      width: 100%;

      font-family: monospace;
      font-size: 14px;

      resize: none;

      padding: 10px;

      box-sizing: border-box;
    }

    /* TOOLBAR */
    #toolbar {
      width: 220px;

      background: #222;
      color: white;

      padding: 20px;

      display: flex;
      flex-direction: column;

      gap: 12px;

      flex-shrink: 0;
    }

    #toolbar h2 {
      margin-top: 0;
    }

    .toolButton {
      padding: 14px;

      border: none;
      border-radius: 10px;

      cursor: pointer;

      font-size: 18px;
      font-weight: bold;

      transition: transform 0.1s;
    }

    .toolButton:hover {
      transform: scale(1.03);
    }

    .selectedTool {
      outline: 4px solid yellow;
    }

  </style>
</head>
<body>

  <!-- MAIN EDITOR -->
  <div id="editorArea">

    <!-- LEFT PANEL -->
    <div id="leftPanel">

      <h1>Nero.io Map Editor</h1>

      <!-- CONTROLS -->
      <div id="controls">

        <label>
          Width:
          <input type="number" id="widthInput" value="11" min="1">
        </label>

        <label>
          Height:
          <input type="number" id="heightInput" value="11" min="1">
        </label>

        <button onclick="createGrid()">Create Grid</button>

        <button onclick="generateJSON()">Generate JSON</button>

        <button onclick="importJSON()">Import JSON</button>

      </div>

      <!-- MAIN CONTENT -->
      <div id="mainContent">

        <!-- GRID -->
        <div id="gridContainer">
          <div id="grid"></div>
        </div>

        <!-- JSON -->
        <div id="jsonPanel">

          <h2>Generated Map</h2>

          <textarea id="output"></textarea>

        </div>

      </div>

    </div>

  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">

    <h2>Tiles</h2>

    <button class="toolButton selectedTool"
            style="background:white; color:black;"
            onclick="selectTile('____', 'white', this)">
      Empty
    </button>

    <button class="toolButton"
            style="background:gray;"
            onclick="selectTile('wall', 'gray', this)">
      Wall
    </button>

    <button class="toolButton"
            style="background:green;"
            onclick="selectTile('tree', 'green', this)">
      Tree
    </button>

    <button class="toolButton"
            style="background:blue;"
            onclick="selectTile('water', 'blue', this)">
      Water
    </button>

    <button class="toolButton"
            style="background:purple;"
            onclick="selectTile('nest', 'purple', this)">
      Nest
    </button>

    <button class="toolButton"
            style="background:orange;"
            onclick="selectTile('lava', 'orange', this)">
      Lava
    </button>

  </div>

  <script>

    // ROOM DATA
    let room = [];

    // CURRENT TILE
    let currentTile = "____";
    let currentColor = "white";

    // DRAG STATES
    let mouseDown = false;
    let eraseMode = false;

    // RECTANGLE FILL
    let fillStart = null;

    // UNDO / REDO
    let undoStack = [];
    let redoStack = [];

    // TILE COLORS
    const tileColors = {
      "____": "white",
      "wall": "gray",
      "tree": "green",
      "water": "blue",
      "nest": "purple",
      "lava": "orange"
    };

    // SAVE STATE
    function saveState() {

      undoStack.push(JSON.stringify(room));

      // LIMIT HISTORY SIZE
      if (undoStack.length > 100) {
        undoStack.shift();
      }

      redoStack = [];
    }

    // UNDO
    function undo() {

      if (undoStack.length === 0) return;

      redoStack.push(JSON.stringify(room));

      room = JSON.parse(undoStack.pop());

      rebuildGrid();
    }

    // REDO
    function redo() {

      if (redoStack.length === 0) return;

      undoStack.push(JSON.stringify(room));

      room = JSON.parse(redoStack.pop());

      rebuildGrid();
    }

    // CTRL+Z / CTRL+Y
    document.addEventListener("keydown", (event) => {

      // CTRL+Z
      if (event.ctrlKey && event.key.toLowerCase() === "z") {

        event.preventDefault();

        undo();
      }

      // CTRL+Y
      if (event.ctrlKey && event.key.toLowerCase() === "y") {

        event.preventDefault();

        redo();
      }

    });

    // TRACK MOUSE
    document.body.addEventListener("mousedown", (event) => {

      mouseDown = true;

      eraseMode = (event.button === 2);

    });

    document.body.addEventListener("mouseup", () => {

      mouseDown = false;

      eraseMode = false;

      fillStart = null;

    });

    // DISABLE RIGHT CLICK MENU
    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    // SELECT TILE
    function selectTile(tileName, color, button) {

      currentTile = tileName;
      currentColor = color;

      const buttons = document.querySelectorAll(".toolButton");

      buttons.forEach(btn => {
        btn.classList.remove("selectedTool");
      });

      button.classList.add("selectedTool");
    }

    // PAINT TILE
    function paintTile(cell, x, y) {

      room[y][x] = currentTile;

      cell.style.background = currentColor;
    }

    // REBUILD GRID
    function rebuildGrid() {

      const height = room.length;
      const width = room[0].length;

      const grid = document.getElementById("grid");

      grid.innerHTML = "";

      grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${height}, 1fr)`;

      for (let y = 0; y < height; y++) {

        for (let x = 0; x < width; x++) {

          const cell = document.createElement("div");

          cell.classList.add("cell");

          const tile = room[y][x];

          cell.style.background =
            tileColors[tile] || "magenta";

          attachCellEvents(cell, x, y);

          grid.appendChild(cell);
        }
      }
    }

    // FILL RECTANGLE
    function fillRectangle(endX, endY) {

      if (!fillStart) return;

      const startX = fillStart.x;
      const startY = fillStart.y;

      const minX = Math.min(startX, endX);
      const maxX = Math.max(startX, endX);

      const minY = Math.min(startY, endY);
      const maxY = Math.max(startY, endY);

      const cells = document.querySelectorAll(".cell");

      const width = room[0].length;

      for (let y = minY; y <= maxY; y++) {

        for (let x = minX; x <= maxX; x++) {

          room[y][x] = currentTile;

          const index = y * width + x;

          cells[index].style.background = currentColor;
        }
      }
    }

    // ATTACH EVENTS TO CELL
    function attachCellEvents(cell, x, y) {

      // MOUSE DOWN
      cell.addEventListener("mousedown", (event) => {

        event.preventDefault();

        saveState();

        // RIGHT CLICK ERASE
        if (event.button === 2) {

          room[y][x] = "____";

          cell.style.background = "white";

          return;
        }

        // SHIFT RECTANGLE FILL
        if (event.shiftKey) {

          fillStart = { x, y };

        } else {

          paintTile(cell, x, y);
        }

      });

      // DRAG PAINT
      cell.addEventListener("mouseover", (event) => {

        event.preventDefault();

        // RIGHT CLICK DRAG ERASE
        if (mouseDown && eraseMode) {

          room[y][x] = "____";

          cell.style.background = "white";

          return;
        }

        // RECTANGLE FILL
        if (mouseDown && fillStart && event.shiftKey) {

          fillRectangle(x, y);

        }

        // NORMAL DRAG PAINT
        else if (mouseDown && !fillStart) {

          paintTile(cell, x, y);
        }

      });

      // RECTANGLE FILL END
      cell.addEventListener("mouseup", (event) => {

        if (fillStart && event.shiftKey) {

          fillRectangle(x, y);

          fillStart = null;
        }

      });

    }

    // CREATE GRID
    function createGrid() {

      const width = parseInt(document.getElementById("widthInput").value);
      const height = parseInt(document.getElementById("heightInput").value);

      room = [];

      for (let y = 0; y < height; y++) {

        room[y] = [];

        for (let x = 0; x < width; x++) {

          const isBorder =
            x === 0 ||
            y === 0 ||
            x === width - 1 ||
            y === height - 1;

          if (isBorder) {

            room[y][x] = "wall";

          } else {

            room[y][x] = "____";
          }
        }
      }

      rebuildGrid();
    }

    // GENERATE JSON
    function generateJSON() {

      let output = "room = [\n";

      for (let y = 0; y < room.length; y++) {

        output += "    [";

        for (let x = 0; x < room[y].length; x++) {

          output += room[y][x];

          if (x < room[y].length - 1) {
            output += ",";
          }

        }

        output += "]";

        if (y < room.length - 1) {
          output += ",";
        }

        output += "\n";
      }

      output += "];";

      document.getElementById("output").value = output;
    }

    // IMPORT JSON
    function importJSON() {

      try {

        let text = document.getElementById("output").value;

        text = text.replace("room =", "").trim();

        text = text.replace(";", "");

        text = text.replace(/\b([a-zA-Z_]+)\b/g, '"$1"');

        room = JSON.parse(text);

        document.getElementById("widthInput").value =
          room[0].length;

        document.getElementById("heightInput").value =
          room.length;

        rebuildGrid();

      } catch (error) {

        alert("Invalid room data!");

        console.error(error);

      }
    }

    // START
    createGrid();

  </script>
</body>
</html>
