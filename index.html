<!DOCTYPE html>
<html>
<head>
  <title>Nero.io Map Editor</title>

  <style>

    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
    }

    /* LEFT SIDE */
    #editorArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 15px;
    }

    /* GRID */
    #grid {
      display: grid;
      width: 700px;
      height: 700px;
      border: 2px solid black;
    }

    .cell {
      border: 1px solid #777;
      cursor: pointer;
      user-select: none;
    }

    /* RIGHT TOOLBAR */
    #toolbar {
      width: 220px;
      background: #222;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toolButton {
      padding: 12px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 8px;
    }

    .selectedTool {
      outline: 4px solid yellow;
    }

    textarea {
      width: 700px;
      height: 250px;
      font-family: monospace;
      font-size: 14px;
    }

  </style>
</head>
<body>

  <!-- LEFT SIDE -->
  <div id="editorArea">

    <h1>Nero.io Map Tile Editor</h1>

    <div>
      Width:
      <input type="number" id="widthInput" value="15" min="1">

      Height:
      <input type="number" id="heightInput" value="15" min="1">

      <button onclick="createGrid()">Create Map Grid</button>

      <button onclick="generateJSON()">Generate JSON</button>
    </div>

    <div id="grid"></div>

    <textarea id="output"></textarea>

  </div>

  <!-- RIGHT SIDE -->
  <div id="toolbar">

    <h2>Tiles</h2>

    <button class="toolButton selectedTool"
            style="background:white; color:black;"
            onclick="selectTile('F___', 'white', this)">
      Empty
    </button>

    <button class="toolButton"
            style="background:gray;"
            onclick="selectTile('wall', 'gray', this)">
      Wall
    </button>

    <button class="toolButton"
            style="background:gray;"
            onclick="selectTile('rock', 'gray', this)">
      Rock
    </button>

    <button class="toolButton"
            style="background:gray;"
            onclick="selectTile('roid', 'gray', this)">
      Mini Rock
    </button>


    <button class="toolButton"
            style="background:green;"
            onclick="selectTile('____', 'green', this)">
      Food
    </button>

    <button class="toolButton"
            style="background:blue;"
            onclick="selectTile('watr', 'blue', this)">
      Water
    </button>

    <button class="toolButton"
            style="background:purple;"
            onclick="selectTile('nest', 'purple', this)">
      Nest
    </button>

    <button class="toolButton"
            style="background:orange;"
            onclick="selectTile('sped', 'orange', this)">
      Boost
    </button>

  </div>

  <script>

    // Stores tile values
    let room = [];

    // Current selected tile
    let currentTile = "F___";
    let currentColor = "white";

    // Tile color lookup
    const tileColors = {
      "F___": "white",
      "rock": "gray",
      "roid": "gray",
      "wall": "gray",
      "____": "green",
      "watr": "blue",
      "nest": "purple",
      "sped": "orange"
    };

    function selectTile(tileName, color, button) {

      currentTile = tileName;
      currentColor = color;

      // Remove highlight from all buttons
      const buttons = document.querySelectorAll(".toolButton");

      buttons.forEach(btn => {
        btn.classList.remove("selectedTool");
      });

      // Highlight selected button
      button.classList.add("selectedTool");
    }

    function createGrid() {

      const width = parseInt(document.getElementById("widthInput").value);
      const height = parseInt(document.getElementById("heightInput").value);

      const grid = document.getElementById("grid");

      grid.innerHTML = "";

      room = [];

      // Create grid layout
      grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${height}, 1fr)`;

      // Create cells
      for (let y = 0; y < height; y++) {

        room[y] = [];

        for (let x = 0; x < width; x++) {

          // Default tile
          room[y][x] = "F___";

          const cell = document.createElement("div");
          cell.classList.add("cell");

          cell.style.background = "white";

          // Click cell
          cell.addEventListener("click", () => {

            // Change tile value
            room[y][x] = currentTile;

            // Change visual color
            cell.style.background = currentColor;

          });

          grid.appendChild(cell);
        }
      }
    }

    function generateJSON() {

      let output = "room = [\n";

      for (let y = 0; y < room.length; y++) {

        output += "    [";

        for (let x = 0; x < room[y].length; x++) {

          output += room[y][x];

          if (x < room[y].length - 1) {
            output += ",";
          }

        }

        output += "]";

        if (y < room.length - 1) {
          output += ",";
        }

        output += "\n";
      }

      output += "];";

      document.getElementById("output").value = output;
    }

    createGrid();

  </script>

</body>
</html>
