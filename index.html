<!DOCTYPE html>
<html>
<head>
  <title>Nero.io Map Editor</title>

  <style>

    body {
      margin: 0;
      font-family: Arial;
      background: #ececec;

      display: flex;
      height: 100vh;

      overflow: hidden;
    }

    #editorArea {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
      overflow: hidden;
    }

    #leftPanel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    #controls input {
      width: 70px;
      padding: 5px;
      font-size: 16px;
    }

    #controls button {
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    #mainContent {
      flex: 1;
      display: flex;
      gap: 20px;
      min-height: 0;
    }

    #gridContainer {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    #grid {
      display: grid;

      width: min(65vw, calc(100vh - 160px));
      height: min(65vw, calc(100vh - 160px));

      background: white;

      border: 2px solid black;

      flex-shrink: 0;
    }

    .cell {
      border: 1px solid #888;
      cursor: pointer;
      box-sizing: border-box;

      user-select: none;
      -webkit-user-drag: none;
    }

    #jsonPanel {
      flex: 1;

      display: flex;
      flex-direction: column;

      min-width: 250px;
      min-height: 0;
    }

    #jsonPanel h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    textarea {
      flex: 1;

      width: 100%;

      font-family: monospace;
      font-size: 14px;

      resize: none;

      padding: 10px;

      box-sizing: border-box;
    }

    #toolbar {
      width: 240px;

      background: #222;
      color: white;

      padding: 20px;

      display: flex;
      flex-direction: column;

      gap: 12px;

      overflow-y: auto;

      flex-shrink: 0;
    }

    #toolbar h2 {
      margin-top: 0;
    }

    .toolButton {
      padding: 14px;

      border: none;
      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;
      font-weight: bold;

      transition: transform 0.1s;
    }

    .toolButton:hover {
      transform: scale(1.03);
    }

    .selectedTool {
      outline: 4px solid yellow;
    }

  </style>
</head>
<body>

  <div id="editorArea">

    <div id="leftPanel">

      <h1>Nero.io Map Editor</h1>

      <div id="controls">

        <label>
          Width:
          <input type="number" id="widthInput" value="11" min="1">
        </label>

        <label>
          Height:
          <input type="number" id="heightInput" value="11" min="1">
        </label>

        <button onclick="createGrid()">Create Grid</button>

        <button onclick="generateJSON()">Generate JSON</button>

        <button onclick="importJSON()">Import JSON</button>

      </div>

      <div id="mainContent">

        <div id="gridContainer">
          <div id="grid"></div>
        </div>

        <div id="jsonPanel">

          <h2>Generated Map</h2>

          <textarea id="output"></textarea>

        </div>

      </div>

    </div>

  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">

    <h2>Tiles</h2>

    <button class="toolButton selectedTool"
            style="background:white; color:black;"
            onclick="selectTile('____', 'white', this)">
      Empty
    </button>

    <button class="toolButton"
            style="background:gray;"
            onclick="selectTile('wall', 'gray', this)">
      Wall
    </button>

    <button class="toolButton"
            style="background:green;"
            onclick="selectTile('tree', 'green', this)">
      Tree
    </button>

    <button class="toolButton"
            style="background:blue;"
            onclick="selectTile('water', 'blue', this)">
      Water
    </button>

    <button class="toolButton"
            style="background:purple;"
            onclick="selectTile('nest', 'purple', this)">
      Nest
    </button>

    <button class="toolButton"
            style="background:orange;"
            onclick="selectTile('lava', 'orange', this)">
      Lava
    </button>

    <!-- BLUE SPAWN -->
    <button class="toolButton"
            style="background:#4da6ff; color:white;"
            onclick="selectTile('teamBlueSpawn', 'teamBlueSpawn', this)">
      ⬡ Blue Spawn
    </button>

    <!-- RED SPAWN -->
    <button class="toolButton"
            style="background:#ff4d4d; color:white;"
            onclick="selectTile('teamRedSpawn', 'teamRedSpawn', this)">
      ⬡ Red Spawn
    </button>

    <!-- ANIMATED TILES -->

    <button class="toolButton"
            style="background: linear-gradient(90deg, red, orange, yellow, green, blue, purple);"
            onclick="selectTile('dancefloor', 'rainbow', this)">
      Rainbow
    </button>

    <button class="toolButton"
            style="background: blue;"
            onclick="selectTile('dancefloor1', 'flashBlueRed', this)">
      Blue/Red
    </button>

    <button class="toolButton"
            style="background: cyan;"
            onclick="selectTile('dancefloor2', 'flashBlueGray', this)">
      Blue/Gray
    </button>

    <button class="toolButton"
            style="background: lightblue;"
            onclick="selectTile('dancefloor3', 'flashGreyBlue', this)">
      Gray/Blue
    </button>

    <button class="toolButton"
            style="background: red;"
            onclick="selectTile('dancefloor4', 'flashRedGrey', this)">
      Red/Gray
    </button>

    <button class="toolButton"
            style="background: pink;"
            onclick="selectTile('dancefloor5', 'flashGreyRed', this)">
      Gray/Red
    </button>

  </div>

  <script>

    // ROOM DATA
    let room = [];

    // CURRENT TILE
    let currentTile = "____";
    let currentColor = "white";

    // DRAG STATES
    let mouseDown = false;
    let eraseMode = false;

    // RECTANGLE FILL
    let fillStart = null;

    // UNDO / REDO
    let undoStack = [];
    let redoStack = [];

    // TILE COLORS
    const tileColors = {
      "____": "white",
      "wall": "gray",
      "tree": "green",
      "water": "blue",
      "nest": "purple",
      "lava": "orange",

      "teamBlueSpawn": "teamBlueSpawn",
      "teamRedSpawn": "teamRedSpawn",

      "dancefloor": "rainbow",
      "dancefloor1": "flashBlueRed",
      "dancefloor2": "flashBlueGray",
      "dancefloor3": "flashGreyBlue",
      "dancefloor4": "flashRedGrey",
      "dancefloor5": "flashGreyRed",
    };

    // SAVE STATE
    function saveState() {

      undoStack.push(JSON.stringify(room));

      if (undoStack.length > 100) {
        undoStack.shift();
      }

      redoStack = [];
    }

    // UNDO
    function undo() {

      if (undoStack.length === 0) return;

      redoStack.push(JSON.stringify(room));

      room = JSON.parse(undoStack.pop());

      rebuildGrid();
    }

    // REDO
    function redo() {

      if (redoStack.length === 0) return;

      undoStack.push(JSON.stringify(room));

      room = JSON.parse(redoStack.pop());

      rebuildGrid();
    }

    // CTRL+Z / CTRL+Y
    document.addEventListener("keydown", (event) => {

      if (event.ctrlKey && event.key.toLowerCase() === "z") {

        event.preventDefault();

        undo();
      }

      if (event.ctrlKey && event.key.toLowerCase() === "y") {

        event.preventDefault();

        redo();
      }

    });

    // TRACK MOUSE
    document.body.addEventListener("mousedown", (event) => {

      mouseDown = true;

      eraseMode = (event.button === 2);

    });

    document.body.addEventListener("mouseup", () => {

      mouseDown = false;

      eraseMode = false;

      fillStart = null;

    });

    // DISABLE RIGHT CLICK MENU
    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    // SELECT TILE
    function selectTile(tileName, color, button) {

      currentTile = tileName;
      currentColor = color;

      const buttons = document.querySelectorAll(".toolButton");

      buttons.forEach(btn => {
        btn.classList.remove("selectedTool");
      });

      button.classList.add("selectedTool");
    }

    // SPAWN TILE RENDER
    function setSpawnTile(cell, color) {

      cell.style.background = color;

      cell.innerHTML = `
        <div style="
          position:absolute;
          inset:0;

          display:flex;
          align-items:center;
          justify-content:center;

          pointer-events:none;

          font-size:65%;
          font-weight:bold;

          color:white;
        ">
          ⬡
        </div>
      `;

      cell.style.position = "relative";

      cell.style.overflow = "hidden";
    }

    // PAINT TILE
    function paintTile(cell, x, y) {

      room[y][x] = currentTile;

      // BLUE SPAWN
      if (currentTile === "teamBlueSpawn") {

        setSpawnTile(cell, "#4da6ff");

        return;
      }

      // RED SPAWN
      if (currentTile === "teamRedSpawn") {

        setSpawnTile(cell, "#ff4d4d");

        return;
      }

      // NORMAL TILES
      cell.innerHTML = "";

      cell.style.position = "";
      cell.style.overflow = "";

      cell.style.background = currentColor;
    }

    // REBUILD GRID
    function rebuildGrid() {

      const height = room.length;
      const width = room[0].length;

      const grid = document.getElementById("grid");

      grid.innerHTML = "";

      grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${height}, 1fr)`;

      for (let y = 0; y < height; y++) {

        for (let x = 0; x < width; x++) {

          const cell = document.createElement("div");

          cell.classList.add("cell");

          const tile = room[y][x];

          const color = tileColors[tile] || "magenta";

          // BLUE SPAWN
          if (tile === "teamBlueSpawn") {

            setSpawnTile(cell, "#4da6ff");
          }

          // RED SPAWN
          else if (tile === "teamRedSpawn") {

            setSpawnTile(cell, "#ff4d4d");
          }

          // NORMAL STATIC TILES
          else if (
            !color.includes("flash") &&
            color !== "rainbow"
          ) {

            cell.style.background = color;

            cell.innerHTML = "";
          }

          attachCellEvents(cell, x, y);

          grid.appendChild(cell);
        }
      }
    }

    // FILL RECTANGLE
    function fillRectangle(endX, endY) {

      if (!fillStart) return;

      const startX = fillStart.x;
      const startY = fillStart.y;

      const minX = Math.min(startX, endX);
      const maxX = Math.max(startX, endX);

      const minY = Math.min(startY, endY);
      const maxY = Math.max(startY, endY);

      const cells = document.querySelectorAll(".cell");

      const width = room[0].length;

      for (let y = minY; y <= maxY; y++) {

        for (let x = minX; x <= maxX; x++) {

          room[y][x] = currentTile;

          const index = y * width + x;

          const cell = cells[index];

          if (currentTile === "teamBlueSpawn") {

            setSpawnTile(cell, "#4da6ff");
          }

          else if (currentTile === "teamRedSpawn") {

            setSpawnTile(cell, "#ff4d4d");
          }

          else {

            cell.innerHTML = "";

            cell.style.position = "";
            cell.style.overflow = "";

            cell.style.background = currentColor;
          }
        }
      }
    }

    // ATTACH EVENTS TO CELL
    function attachCellEvents(cell, x, y) {

      // MOUSE DOWN
      cell.addEventListener("mousedown", (event) => {

        event.preventDefault();

        saveState();

        // RIGHT CLICK ERASE
        if (event.button === 2) {

          room[y][x] = "____";

          cell.style.background = "white";

          cell.innerHTML = "";

          cell.style.position = "";
          cell.style.overflow = "";

          return;
        }

        // SHIFT RECTANGLE FILL
        if (event.shiftKey) {

          fillStart = { x, y };

        } else {

          paintTile(cell, x, y);
        }

      });

      // DRAG PAINT
      cell.addEventListener("mouseover", (event) => {

        event.preventDefault();

        // RIGHT CLICK DRAG ERASE
        if (mouseDown && eraseMode) {

          room[y][x] = "____";

          cell.style.background = "white";

          cell.innerHTML = "";

          cell.style.position = "";
          cell.style.overflow = "";

          return;
        }

        // RECTANGLE FILL
        if (mouseDown && fillStart && event.shiftKey) {

          fillRectangle(x, y);

        }

        // NORMAL DRAG PAINT
        else if (mouseDown && !fillStart) {

          paintTile(cell, x, y);
        }

      });

      // RECTANGLE FILL END
      cell.addEventListener("mouseup", (event) => {

        if (fillStart && event.shiftKey) {

          fillRectangle(x, y);

          fillStart = null;
        }

      });

    }

    // CREATE GRID
    function createGrid() {

      const width = parseInt(document.getElementById("widthInput").value);
      const height = parseInt(document.getElementById("heightInput").value);

      room = [];

      for (let y = 0; y < height; y++) {

        room[y] = [];

        for (let x = 0; x < width; x++) {

          const isBorder =
            x === 0 ||
            y === 0 ||
            x === width - 1 ||
            y === height - 1;

          if (isBorder) {

            room[y][x] = "wall";

          } else {

            room[y][x] = "____";
          }
        }
      }

      rebuildGrid();
    }

    // GENERATE JSON
    function generateJSON() {

      let output = "room = [\n";

      for (let y = 0; y < room.length; y++) {

        output += "    [";

        for (let x = 0; x < room[y].length; x++) {

          output += room[y][x];

          if (x < room[y].length - 1) {
            output += ",";
          }

        }

        output += "]";

        if (y < room.length - 1) {
          output += ",";
        }

        output += "\n";
      }

      output += "];";

      document.getElementById("output").value = output;
    }

    // IMPORT JSON
    function importJSON() {

      try {

        let text = document.getElementById("output").value;

        text = text.replace("room =", "").trim();

        text = text.replace(";", "");

        text = text.replace(/\b([a-zA-Z_]+)\b/g, '"$1"');

        room = JSON.parse(text);

        document.getElementById("widthInput").value =
          room[0].length;

        document.getElementById("heightInput").value =
          room.length;

        rebuildGrid();

      } catch (error) {

        alert("Invalid room data!");

        console.error(error);

      }
    }

    // ANIMATE TILES
    function animateTiles() {

      const cells = document.querySelectorAll(".cell");

      if (room.length === 0) {

        requestAnimationFrame(animateTiles);

        return;
      }

      const width = room[0].length;

      const time = Date.now();

      for (let y = 0; y < room.length; y++) {

        for (let x = 0; x < room[y].length; x++) {

          const tile = room[y][x];

          const index = y * width + x;

          const cell = cells[index];

          if (!cell) continue;

          // RAINBOW
          if (tile === "dancefloor") {

            const hue =
              (time / 10 + (x + y) * 20) % 360;

            cell.style.background =
              `hsl(${hue}, 100%, 50%)`;
          }

          // BLUE / RED
          else if (tile === "dancefloor1") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "blue" : "red";
          }

          // BLUE / GRAY
          else if (tile === "dancefloor2") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "blue" : "gray";
          }

          // GRAY / BLUE
          else if (tile === "dancefloor3") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "gray" : "blue";
          }

          // RED / GRAY
          else if (tile === "dancefloor4") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "red" : "gray";
          }

          // GRAY / RED
          else if (tile === "dancefloor5") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "gray" : "red";
          }

        }
      }

      requestAnimationFrame(animateTiles);
    }

    // START
    createGrid();

    animateTiles();

  </script>
</body>
</html>
