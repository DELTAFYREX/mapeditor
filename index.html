<!DOCTYPE html>
<html>
<head>
  <title>Nero.io Map Editor</title>

  <style>

    body {
      margin: 0;
      font-family: Arial;
      background: #ececec;

      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #editorArea {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
      overflow: hidden;
    }

    #leftPanel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    #controls input {
      width: 70px;
      padding: 5px;
      font-size: 16px;
    }

    #controls button {
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    #mainContent {
      flex: 1;
      display: flex;
      gap: 20px;
      min-height: 0;
    }

    #gridContainer {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    #grid {
      display: grid;

      width: min(65vw, calc(100vh - 160px));
      height: min(65vw, calc(100vh - 160px));

      background: white;

      border: 2px solid black;

      flex-shrink: 0;
    }

    .cell {
      border: 1px solid #888;
      cursor: pointer;
      box-sizing: border-box;

      user-select: none;
      -webkit-user-drag: none;
    }

    #jsonPanel {
      flex: 1;

      display: flex;
      flex-direction: column;

      min-width: 250px;
      min-height: 0;
    }

    #jsonPanel h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    textarea {
      flex: 1;

      width: 100%;

      font-family: monospace;
      font-size: 14px;

      resize: none;

      padding: 10px;

      box-sizing: border-box;
    }

    #toolbar {
      width: 240px;

      background: #222;
      color: white;

      padding: 20px;

      display: flex;
      flex-direction: column;

      gap: 12px;

      overflow-y: auto;

      flex-shrink: 0;
    }

    #toolbar h2 {
      margin-top: 0;
    }

    .toolButton {
      padding: 14px;

      border: none;
      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;
      font-weight: bold;

      transition: transform 0.1s;
    }

    .toolButton:hover {
      transform: scale(1.03);
    }

    .selectedTool {
      outline: 4px solid yellow;
    }

  </style>
</head>
<body>

  <div id="editorArea">

    <div id="leftPanel">

      <h1>Nero.io Map Editor</h1>

      <div id="controls">

        <label>
          Width:
          <input type="number" id="widthInput" value="11" min="1">
        </label>

        <label>
          Height:
          <input type="number" id="heightInput" value="11" min="1">
        </label>

        <button onclick="createGrid()">Create Grid</button>

        <button onclick="generateJSON()">Generate JSON</button>

        <button onclick="importJSON()">Import JSON</button>

      </div>

      <div id="mainContent">

        <div id="gridContainer">
          <div id="grid"></div>
        </div>

        <div id="jsonPanel">

          <h2>Generated Map</h2>

          <textarea id="output"></textarea>

        </div>

      </div>

    </div>

  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">

    <h2>Tiles</h2>

<!-- EMPTY -->
<button class="toolButton selectedTool"
        style="background:#F0F7FA; color:black;"
        onclick="selectTile('____', '#F0F7FA', this)">
  Empty
</button>

<!-- EMPTY HEX -->
<button class="toolButton"
        style="background:#F0F7FA; color:black;"
        onclick="selectTile('neutralSpawn', 'neutralSpawn', this)">
  ⬡ Neutral Spawn
</button>

<!-- WALL -->
<button class="toolButton"
        style="background:#959597;"
        onclick="selectTile('wall', '#959597', this)">
  Wall
</button>

    <button class="toolButton"
            style="background:green;"
            onclick="selectTile('tree', 'green', this)">
      Tree
    </button>

    <button class="toolButton"
            style="background:blue;"
            onclick="selectTile('water', 'blue', this)">
      Water
    </button>

<!-- NEST -->
<button class="toolButton"
        style="background:#E0E1F4;"
        onclick="selectTile('nest', '#E0E1F4', this)">
  Nest
</button>

    <button class="toolButton"
            style="background:orange;"
            onclick="selectTile('lava', 'orange', this)">
      Lava
    </button>

<!-- BLUE SPAWN -->
<button class="toolButton"
        style="background:#CAE4F6; color:black;"
        onclick="selectTile('teamBlueSpawn', 'teamBlueSpawn', this)">
  ⬡ Blue Spawn
</button>

<!-- RED SPAWN -->
<button class="toolButton"
        style="background:#F3CED1; color:black;"
        onclick="selectTile('teamRedSpawn', 'teamRedSpawn', this)">
  ⬡ Red Spawn
</button>

    <!-- CONTROL POINT 1 -->
    <button class="toolButton"
            style="background: linear-gradient(90deg, red, white, blue); color:black;"
            onclick="selectTile('controlPoint1', 'controlPoint1', this)">
      1 Control Point
    </button>

    <!-- CONTROL POINT 2 -->
    <button class="toolButton"
            style="background: linear-gradient(90deg, red, white, blue); color:black;"
            onclick="selectTile('controlPoint2', 'controlPoint2', this)">
      2 Control Point
    </button>

  <!-- SOFT POINT 1 -->
<button class="toolButton"
        style="background:#cacacb; color:black;"
        onclick="selectTile('softPoint1', 'softPoint1', this)">
  1 Soft Point
</button>

<!-- SOFT POINT 2 -->
<button class="toolButton"
        style="background:#cacacb; color:black;"
        onclick="selectTile('softPoint2', 'softPoint2', this)">
  2 Soft Point
</button>

    <!-- ANIMATED TILES -->

    <button class="toolButton"
            style="background: linear-gradient(90deg, red, orange, yellow, green, blue, purple);"
            onclick="selectTile('dancefloor', 'rainbow', this)">
      Rainbow
    </button>

    <button class="toolButton"
            style="background: blue;"
            onclick="selectTile('dancefloor1', 'flashBlueRed', this)">
      Blue/Red
    </button>

    <button class="toolButton"
            style="background: cyan;"
            onclick="selectTile('dancefloor2', 'flashBlueGray', this)">
      Blue/Gray
    </button>

    <button class="toolButton"
            style="background: lightblue;"
            onclick="selectTile('dancefloor3', 'flashGreyBlue', this)">
      Gray/Blue
    </button>

    <button class="toolButton"
            style="background: red;"
            onclick="selectTile('dancefloor4', 'flashRedGrey', this)">
      Red/Gray
    </button>

    <button class="toolButton"
            style="background: pink;"
            onclick="selectTile('dancefloor5', 'flashGreyRed', this)">
      Gray/Red
    </button>

  </div>

  <script>

    let room = [];

    let currentTile = "____";
    let currentColor = "white";

    let mouseDown = false;
    let eraseMode = false;

    let fillStart = null;

    let undoStack = [];
    let redoStack = [];

const tileColors = {

  "____": "#F0F7FA",

  "wall": "#959597",

  "tree": "green",

  "water": "blue",

  "nest": "#E0E1F4",

  "lava": "orange",

  "teamBlueSpawn": "teamBlueSpawn",

  "teamRedSpawn": "teamRedSpawn",

  "neutralSpawn": "neutralSpawn",

  "controlPoint1": "controlPoint1",

  "controlPoint2": "controlPoint2",

  "softPoint1": "softPoint1",

  "softPoint2": "softPoint2",

  "dancefloor": "rainbow",

  "dancefloor1": "flashBlueRed",

  "dancefloor2": "flashBlueGray",

  "dancefloor3": "flashGreyBlue",

  "dancefloor4": "flashRedGrey",

  "dancefloor5": "flashGreyRed",
};

    function saveState() {

      undoStack.push(JSON.stringify(room));

      if (undoStack.length > 100) {
        undoStack.shift();
      }

      redoStack = [];
    }

    function undo() {

      if (undoStack.length === 0) return;

      redoStack.push(JSON.stringify(room));

      room = JSON.parse(undoStack.pop());

      rebuildGrid();
    }

    function redo() {

      if (redoStack.length === 0) return;

      undoStack.push(JSON.stringify(room));

      room = JSON.parse(redoStack.pop());

      rebuildGrid();
    }

    document.addEventListener("keydown", (event) => {

      if (event.ctrlKey && event.key.toLowerCase() === "z") {

        event.preventDefault();

        undo();
      }

      if (event.ctrlKey && event.key.toLowerCase() === "y") {

        event.preventDefault();

        redo();
      }

    });

    document.body.addEventListener("mousedown", (event) => {

      mouseDown = true;

      eraseMode = (event.button === 2);

    });

    document.body.addEventListener("mouseup", () => {

      mouseDown = false;

      eraseMode = false;

      fillStart = null;

    });

    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    function selectTile(tileName, color, button) {

      currentTile = tileName;
      currentColor = color;

      const buttons = document.querySelectorAll(".toolButton");

      buttons.forEach(btn => {
        btn.classList.remove("selectedTool");
      });

      button.classList.add("selectedTool");
    }

function setSpawnTile(cell, color) {

  cell.style.background = color;

  cell.innerHTML = `
    <div style="
      position:absolute;
      inset:0;

      display:flex;
      align-items:center;
      justify-content:center;

      pointer-events:none;

      font-size:65%;
      font-weight:bold;

      color:white;
    ">
      ⬡
    </div>
  `;

  cell.style.position = "relative";

  cell.style.overflow = "hidden";
}

function setSoftPointTile(cell, number) {

  cell.style.background = "#cacacb";

  cell.innerHTML = `
    <div style="
      position:absolute;
      inset:0;

      display:flex;
      align-items:center;
      justify-content:center;

      pointer-events:none;

      font-size:85%;
      font-weight:bold;

      color:black;
    ">
      ${number}
    </div>
  `;

  cell.style.position = "relative";

  cell.style.overflow = "hidden";
}

    function paintTile(cell, x, y) {

      room[y][x] = currentTile;

      if (currentTile === "teamBlueSpawn") {

        setSpawnTile(cell, "#CAE4F6");

        return;
      }

      if (currentTile === "teamRedSpawn") {

        setSpawnTile(cell, "#F3CED1");

        return;
      }

      if (currentTile === "controlPoint1") {

        setControlPointTile(cell, "1");

        return;
      }

      if (currentTile === "controlPoint2") {

        setControlPointTile(cell, "2");

        return;
      }

// NEUTRAL SPAWN
if (currentTile === "neutralSpawn") {

  setSpawnTile(cell, "#F0F7FA");

  return;
}

// SOFT POINT 1
if (currentTile === "softPoint1") {

  setSoftPointTile(cell, "1");

  return;
}

// SOFT POINT 2
if (currentTile === "softPoint2") {

  setSoftPointTile(cell, "2");

  return;
}

      cell.innerHTML = "";

      cell.style.position = "";
      cell.style.overflow = "";

      cell.style.background = currentColor;
    }

    function rebuildGrid() {

      const height = room.length;
      const width = room[0].length;

      const grid = document.getElementById("grid");

      grid.innerHTML = "";

      grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${height}, 1fr)`;

      for (let y = 0; y < height; y++) {

        for (let x = 0; x < width; x++) {

          const cell = document.createElement("div");

          cell.classList.add("cell");

          const tile = room[y][x];

          const color = tileColors[tile] || "magenta";

          if (tile === "teamBlueSpawn") {

            setSpawnTile(cell, "#4da6ff");
          }

          else if (tile === "teamRedSpawn") {

            setSpawnTile(cell, "#ff4d4d");
          }

          else if (tile === "controlPoint1") {

            setControlPointTile(cell, "1");
          }

          else if (tile === "controlPoint2") {

            setControlPointTile(cell, "2");
          }

else if (tile === "neutralSpawn") {

  setSpawnTile(cell, "#F0F7FA");
}

else if (tile === "softPoint1") {

  setSoftPointTile(cell, "1");
}

else if (tile === "softPoint2") {

  setSoftPointTile(cell, "2");
}

          else if (
            !color.includes("flash") &&
            color !== "rainbow"
          ) {

            cell.style.background = color;

            cell.innerHTML = "";
          }

          attachCellEvents(cell, x, y);

          grid.appendChild(cell);
        }
      }
    }

    function fillRectangle(endX, endY) {

      if (!fillStart) return;

      const startX = fillStart.x;
      const startY = fillStart.y;

      const minX = Math.min(startX, endX);
      const maxX = Math.max(startX, endX);

      const minY = Math.min(startY, endY);
      const maxY = Math.max(startY, endY);

      const cells = document.querySelectorAll(".cell");

      const width = room[0].length;

      for (let y = minY; y <= maxY; y++) {

        for (let x = minX; x <= maxX; x++) {

          room[y][x] = currentTile;

          const index = y * width + x;

          const cell = cells[index];

          if (currentTile === "teamBlueSpawn") {

            setSpawnTile(cell, "#4da6ff");
          }

          else if (currentTile === "teamRedSpawn") {

            setSpawnTile(cell, "#ff4d4d");
          }

          else if (currentTile === "controlPoint1") {

            setControlPointTile(cell, "1");
          }

          else if (currentTile === "controlPoint2") {

            setControlPointTile(cell, "2");
          }

else if (currentTile === "neutralSpawn") {

  setSpawnTile(cell, "#F0F7FA");
}

else if (currentTile === "softPoint1") {

  setSoftPointTile(cell, "1");
}

else if (currentTile === "softPoint2") {

  setSoftPointTile(cell, "2");
}

          else {

            cell.innerHTML = "";

            cell.style.position = "";
            cell.style.overflow = "";

            cell.style.background = currentColor;
          }
        }
      }
    }

    function attachCellEvents(cell, x, y) {

      cell.addEventListener("mousedown", (event) => {

        event.preventDefault();

        saveState();

        if (event.button === 2) {

          room[y][x] = "____";

          cell.style.background = "#F0F7FA";

          cell.innerHTML = "";

          cell.style.position = "";
          cell.style.overflow = "";

          return;
        }

        if (event.shiftKey) {

          fillStart = { x, y };

        } else {

          paintTile(cell, x, y);
        }

      });

      cell.addEventListener("mouseover", (event) => {

        event.preventDefault();

        if (mouseDown && eraseMode) {

          room[y][x] = "____";

          cell.style.background = "#F0F7FA";
          
          cell.innerHTML = "";

          cell.style.position = "";
          cell.style.overflow = "";

          return;
        }

        if (mouseDown && fillStart && event.shiftKey) {

          fillRectangle(x, y);

        }

        else if (mouseDown && !fillStart) {

          paintTile(cell, x, y);
        }

      });

      cell.addEventListener("mouseup", (event) => {

        if (fillStart && event.shiftKey) {

          fillRectangle(x, y);

          fillStart = null;
        }

      });

    }

    function createGrid() {

      const width = parseInt(document.getElementById("widthInput").value);
      const height = parseInt(document.getElementById("heightInput").value);

      room = [];

      for (let y = 0; y < height; y++) {

        room[y] = [];

        for (let x = 0; x < width; x++) {

          const isBorder =
            x === 0 ||
            y === 0 ||
            x === width - 1 ||
            y === height - 1;

          if (isBorder) {

            room[y][x] = "wall";

          } else {

            room[y][x] = "____";
          }
        }
      }

      rebuildGrid();
    }

    function generateJSON() {

      let output = "room = [\n";

      for (let y = 0; y < room.length; y++) {

        output += "    [";

        for (let x = 0; x < room[y].length; x++) {

          output += room[y][x];

          if (x < room[y].length - 1) {
            output += ",";
          }

        }

        output += "]";

        if (y < room.length - 1) {
          output += ",";
        }

        output += "\n";
      }

      output += "];";

      document.getElementById("output").value = output;
    }

    function importJSON() {

      try {

        let text = document.getElementById("output").value;

        text = text.replace("room =", "").trim();

        text = text.replace(";", "");

        text = text.replace(/\b([a-zA-Z_]+)\b/g, '"$1"');

        room = JSON.parse(text);

        document.getElementById("widthInput").value =
          room[0].length;

        document.getElementById("heightInput").value =
          room.length;

        rebuildGrid();

      } catch (error) {

        alert("Invalid room data!");

        console.error(error);

      }
    }

    function animateTiles() {

      const cells = document.querySelectorAll(".cell");

      if (room.length === 0) {

        requestAnimationFrame(animateTiles);

        return;
      }

      const width = room[0].length;

      const time = Date.now();

      for (let y = 0; y < room.length; y++) {

        for (let x = 0; x < room[y].length; x++) {

          const tile = room[y][x];

          const index = y * width + x;

          const cell = cells[index];

          if (!cell) continue;

          // RAINBOW
          if (tile === "dancefloor") {

            const hue =
              (time / 10 + (x + y) * 20) % 360;

            cell.style.background =
              `hsl(${hue}, 100%, 50%)`;
          }

          // BLUE / RED
          else if (tile === "dancefloor1") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "blue" : "red";
          }

          // BLUE / GRAY
          else if (tile === "dancefloor2") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "blue" : "gray";
          }

          // GRAY / BLUE
          else if (tile === "dancefloor3") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "gray" : "blue";
          }

          // RED / GRAY
          else if (tile === "dancefloor4") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "red" : "gray";
          }

          // GRAY / RED
          else if (tile === "dancefloor5") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "gray" : "red";
          }

          // CONTROL POINTS
          else if (
            tile === "controlPoint1" ||
            tile === "controlPoint2"
          ) {

            const speed = 250;

            const phase =
              Math.floor(time / speed) % 4;

if (phase === 0) {

  cell.style.background = "#f6dede";
}

else if (phase === 1) {

  cell.style.background = "#F0F7FA";
}

else if (phase === 2) {

  cell.style.background = "#dcecf8";
}

else {

  cell.style.background = "#F0F7FA";
}
          }

        }
      }

      requestAnimationFrame(animateTiles);
    }

    createGrid();

    animateTiles();

  </script>
</body>
</html>
