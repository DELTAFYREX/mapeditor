<!DOCTYPE html>
<html>
<head>
  <title>Nero.io Map Editor</title>

  <style>

    body {
      margin: 0;
      font-family: Arial;
      background: #ececec;
      color: white;

      display: flex;
      height: 100vh;
            background-image: url("https://deltafyrex.github.io/neroassets/nero-logo-text.png?v=1746742162513");

      overflow: hidden;
    }

    #editorArea {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
      overflow: hidden;
    }

    #leftPanel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;

    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    #controls input {
      width: 70px;
      padding: 5px;
      font-size: 16px;
    }

    #controls button {
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    #mainContent {
      flex: 1;
      display: flex;
      gap: 20px;
      min-height: 0;
    }

    #gridContainer {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    #grid {
      display: grid;

      width: min(65vw, calc(100vh - 160px));
      height: min(65vw, calc(100vh - 160px));

      background: #F0F7FA;

      border: 2px solid white;
        outline: 2px solid black; /* Outer outline */


      flex-shrink: 0;
    }

    .cell {
      border: 1px solid #888;
      cursor: pointer;
      box-sizing: border-box;

      user-select: none;
      -webkit-user-drag: none;
    }

    #jsonPanel {
      flex: 1;
      background-color: "#DDE6EB";

      display: flex;
      flex-direction: column;

      min-width: 250px;
      min-height: 0;


    }

    #jsonPanel h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    textarea {
      flex: 1;

      width: 100%;

      font-family: monospace;
      font-size: 14px;

      resize: none;

      padding: 10px;

      box-sizing: border-box;

                  border: 2px solid white;
        outline: 2px solid black; /* Outer outline */
    }

    #toolbar {
      width: 240px;

      background: #222;
      color: white;

      padding: 20px;

      display: flex;
      flex-direction: column;

      gap: 12px;

      overflow-y: auto;

      flex-shrink: 0;
    }

    #toolbar h2 {
      margin-top: 0;
    }

    .toolButton {
      padding: 14px;

      border: none;
      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;
      font-weight: bold;

      transition: transform 0.1s;
    }

    .toolButton:hover {
      transform: scale(1.03);
    }

    .selectedTool {
      outline: 4px solid yellow;
    }

    function saveState() {

      undoStack.push(JSON.stringify(room));

      if (undoStack.length > 100) {
        undoStack.shift();
      }

      redoStack = [];
    }

    function undo() {

      if (undoStack.length === 0) return;

      redoStack.push(JSON.stringify(room));

      room = JSON.parse(undoStack.pop());

      rebuildGrid();
    }

    function redo() {

      if (redoStack.length === 0) return;

      undoStack.push(JSON.stringify(room));

      room = JSON.parse(redoStack.pop());

      rebuildGrid();
    }

    document.addEventListener("keydown", (event) => {

      if (event.ctrlKey && event.key.toLowerCase() === "z") {

        event.preventDefault();

        redo();

    function rebuildGrid() {

      const height = room.length;
      const width = room[0].length;

      const grid = document.getElementById("grid");

      grid.innerHTML = "";

      grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${height}, 1fr)`;

      for (let y = 0; y < height; y++) {

        for (let x = 0; x < width; x++) {

          const cell = document.createElement("div");

          cell.classList.add("cell");

          const tile = room[y][x];

          const color = tileColors[tile] || "magenta";

          if (tile === "sblu") {

            setSpawnTile(cell, "#CAE4F6");
          }

          else if (tile === "sgre") {

            setSpawnTile(cell, "#F3CED1");
          }

          else if (tile === "cont") {

            setSpawnTile(cell, "#F0F7FA");
          }

          else if (tile === "ucon") {

            setControlPointTile(cell, "1");
          }

          else if (tile === "uco2") {

            setControlPointTile(cell, "2");
          }

          else if (tile === "UWAL") {

            setSoftPointTile(cell, "1");
          }

          else if (tile === "UWA2") {

            setSoftPointTile(cell, "2");
          }

          else if (tile === "roid") {

            setSoftPointTileblack(cell, "□", "#bababa");
          }

          else if (tile === "rock") {

            setSoftPointTileblack(cell, "▣", "#bababa");
          }

          else if (tile === "blrd") {

            setSoftPointTileblack(cell, "□", "black");

          else if (tile === "blrk") {

            setSoftPointTileblack(cell, "▣", "black");
          }
                    else if (tile === "atmg") {


                  setSoftPointTileblack(cell, "🥆", "#fceded", "black");

          else if (
            !color.includes("dancefloor") &&
            color !== "rainbow"
          ) {

            cell.style.background = color;

            cell.innerHTML = "";
          }

          attachCellEvents(cell, x, y);

          grid.appendChild(cell);
        }
      }
    }

    function fillRectangle(endX, endY) {

      if (!fillStart) return;

      const startX = fillStart.x;
      const startY = fillStart.y;

      const minX = Math.min(startX, endX);
      const maxX = Math.max(startX, endX);

      const minY = Math.min(startY, endY);
      const maxY = Math.max(startY, endY);

      const cells = document.querySelectorAll(".cell");

      const width = room[0].length;

      for (let y = minY; y <= maxY; y++) {

        for (let x = minX; x <= maxX; x++) {

          room[y][x] = currentTile;

          const index = y * width + x;

          const cell = cells[index];

          if (currentTile === "sblu") {

            setSpawnTile(cell, "#CAE4F6");
          }

          else if (currentTile === "sgre") {

            setSpawnTile(cell, "#F3CED1");
          }

          else if (currentTile === "cont") {

            setSpawnTile(cell, "#F0F7FA");
          }

          else if (currentTile === "ucon") {

            setControlPointTile(cell, "1");
          }

          else if (currentTile === "uco2") {

            setControlPointTile(cell, "2");
          }

          else if (currentTile === "UWAL") {

            setSoftPointTile(cell, "1");
          }

          else if (currentTile === "UWA2") {

            setSoftPointTile(cell, "2");
          }

          else if (currentTile === "roid") {

            setSoftPointTileblack(cell, "□", "#bababa");
          }

          else if (currentTile === "rock") {

            setSoftPointTileblack(cell, "▣", "#bababa");
          }

          else if (currentTile === "blackroid") {

            setSoftPointTileblack(cell, "□", "black");
          }

          else if (currentTile === "blackrock") {

            setSoftPointTileblack(cell, "▣", "black");
          }

          else {

            cell.innerHTML = "";

            cell.style.position = "";
            cell.style.overflow = "";

            cell.style.background = currentColor;
          }
        }
      }
    }

    function attachCellEvents(cell, x, y) {

      cell.addEventListener("mousedown", (event) => {

        event.preventDefault();

        saveState();

        if (event.button === 2) {

          room[y][x] = myVariable ? "cont" : "F___";

          cell.style.background = "#F0F7FA";          

          cell.innerHTML = myVariable ? `
        <div style="
          position:absolute;
          inset:0;

          display:flex;
          align-items:center;
          justify-content:center;

          pointer-events:none;

          font-size:65%;
          font-weight:bold;

          color:black;
        ">
          ⬡
        </div>
      ` : "";

          cell.style.position = myVariable ? "relative" : "";
          cell.style.overflow = myVariable ? "hidden" : "";

          return;
        }

        if (event.shiftKey) {

          fillStart = { x, y };

        } else {

          paintTile(cell, x, y);
        }

      });

      cell.addEventListener("mouseover", (event) => {

        event.preventDefault();

        if (mouseDown && eraseMode) {

          room[y][x] = myVariable ? "cont" : "F___";

          cell.style.background = "#F0F7FA";
                    
          cell.style.position = "relative";

          cell.style.overflow = "hidden";

          cell.innerHTML = myVariable ? `
        <div style="
          position:absolute;
          inset:0;

          display:flex;
          align-items:center;
          justify-content:center;

          pointer-events:none;

          font-size:65%;
          font-weight:bold;

          color:black;
        ">
          ⬡
        </div>
      ` : "";

          cell.style.position = myVariable ? "relative" : "";
          cell.style.overflow = myVariable ? "hidden" : "";

          return;
        }

        if (mouseDown && fillStart && event.shiftKey) {

          fillRectangle(x, y);

        }

        else if (mouseDown && !fillStart) {

          paintTile(cell, x, y);
        }

      });

      cell.addEventListener("mouseup", (event) => {

        if (fillStart && event.shiftKey) {

          fillRectangle(x, y);

          fillStart = null;
        }

      });

    }

function createGrid() {

  const width = parseInt(document.getElementById("widthInput").value);
  const height = parseInt(document.getElementById("heightInput").value);

  room = [];

  for (let y = 0; y < height; y++) {

    room[y] = [];

    for (let x = 0; x < width; x++) {

      const isBorder =
        x === 0 ||
        y === 0 ||
        x === width - 1 ||
        y === height - 1;

      if (isBorder) {

        room[y][x] =
          myVariable ? "WALL" : "F___";

      } else {

        room[y][x] =
          myVariable ? "cont" : "F___";
      }
    }
  }

  rebuildGrid();
}

    function generateJSON() {

      let output = "room = [\n";

      for (let y = 0; y < room.length; y++) {

        output += "    [";

        for (let x = 0; x < room[y].length; x++) {

          output += room[y][x];

          if (x < room[y].length - 1) {
            output += ",";
          }

        }

        output += "]";

        if (y < room.length - 1) {
          output += ",";
        }

        output += "\n";
      }

      output += "];";

      document.getElementById("output").value = output;
    }

    function importJSON() {

      try {

        let text = document.getElementById("output").value;

        text = text.replace("room =", "").trim();

        text = text.replace(";", "");

text = text.replace(/\b([a-zA-Z0-9_]+)\b/g, '"$1"');
        room = JSON.parse(text);

        document.getElementById("widthInput").value =
          room[0].length;

        document.getElementById("heightInput").value =
          room.length;

        rebuildGrid();

      } catch (error) {

        alert("Invalid room data!");

        console.error(error);

      }
    }

    function animateTiles() {

      const cells = document.querySelectorAll(".cell");

      if (room.length === 0) {

        requestAnimationFrame(animateTiles);

        return;
      }

      const width = room[0].length;

      const time = Date.now();

      for (let y = 0; y < room.length; y++) {

        for (let x = 0; x < room[y].length; x++) {

          const tile = room[y][x];

          const index = y * width + x;

          const cell = cells[index];

          if (!cell) continue;

          // RAINBOW
          if (tile === "dcf0") {

            const hue =
              (time / 10 + (x + y) * 20) % 360;

            cell.style.background =
              `hsl(${hue}, 100%, 50%)`;
          }

          // BLUE / RED
          else if (tile === "dcf1") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "blue" : "red";
          }

          // BLUE / GRAY
          else if (tile === "dcf2") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "blue" : "gray";
          }

          // GRAY / BLUE
          else if (tile === "dcf3") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "gray" : "blue";
          }

          // RED / GRAY
          else if (tile === "dcf4") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "red" : "gray";
          }

          // GRAY / RED
          else if (tile === "dcf5") {

            const flash =
              Math.sin(time / 150) > 0;

            cell.style.background =
              flash ? "gray" : "red";
          }

          // CONTROL POINTS
          else if (
            tile === "ucon" ||
            tile === "uco2"
          ) {

            const speed = 550;

            const phase =
              Math.floor(time / speed) % 4;

            if (phase === 0) {

              cell.style.background = "#f6dede";
            }

            else if (phase === 1) {

              cell.style.background = "#F0F7FA";
            }

            else if (phase === 2) {

              cell.style.background = "#dcecf8";
            }

            else {

              cell.style.background = "#F0F7FA";
            }
          }

        }
      }

      requestAnimationFrame(animateTiles);
    }

    createGrid();

    animateTiles();
