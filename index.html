<!DOCTYPE html>
<html>
<head>
  <title>Nero.io Map Editor</title>

  <style>

 body {
  margin: 0;
  font-family: Arial;
  background: #ececec;

  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* MAIN AREA */
#editorArea {
  flex: 1;

  display: flex;

  padding: 20px;
  gap: 20px;

  overflow: hidden;
}

/* LEFT SIDE */
#leftPanel {
  flex: 1;

  display: flex;
  flex-direction: column;

  min-width: 0;
}

/* CONTROLS */
#controls {
  display: flex;
  flex-wrap: wrap;

  align-items: center;

  gap: 10px;

  margin-bottom: 15px;
}

#controls input {
  width: 70px;

  padding: 5px;

  font-size: 16px;
}

#controls button {
  padding: 8px 12px;

  font-size: 14px;

  cursor: pointer;
}

/* MAIN CONTENT AREA */
#mainContent {
  flex: 1;

  display: flex;

  gap: 20px;

  min-height: 0;
}

/* GRID SIDE */
#gridContainer {
  display: flex;

  align-items: flex-start;
  justify-content: flex-start;
}

/* GRID */
#grid {
  display: grid;

  width: min(65vw, calc(100vh - 160px));
  height: min(65vw, calc(100vh - 160px));

  background: white;

  border: 2px solid black;

  flex-shrink: 0;
}

.cell {
  border: 1px solid #888;

  cursor: pointer;

  box-sizing: border-box;
}

/* JSON SIDE */
#jsonPanel {
  flex: 1;

  display: flex;
  flex-direction: column;

  min-width: 250px;
  min-height: 0;
}

#jsonPanel h2 {
  margin-top: 0;
  margin-bottom: 10px;
}

/* JSON BOX */
textarea {
  flex: 1;

  width: 100%;

  font-family: monospace;
  font-size: 14px;

  resize: none;

  padding: 10px;

  box-sizing: border-box;
}

/* TOOLBAR */
#toolbar {
  width: 220px;

  background: #222;
  color: white;

  padding: 20px;

  display: flex;
  flex-direction: column;
  gap: 12px;

  flex-shrink: 0;
}

#toolbar h2 {
  margin-top: 0;
}

.toolButton {
  padding: 14px;

  border: none;
  border-radius: 10px;

  cursor: pointer;

  font-size: 18px;
  font-weight: bold;

  transition: transform 0.1s;
}

.toolButton:hover {
  transform: scale(1.03);
}

.selectedTool {
  outline: 4px solid yellow;
}

  </style>
</head>
<body>

  <!-- MAIN EDITOR -->
  <div id="editorArea">

    <!-- LEFT SIDE -->
    <div id="leftPanel">

      <h1>Nero.io Map Editor</h1>

<div id="controls">

  <label>
    Width:
    <input type="number" id="widthInput" value="11" min="1">
  </label>

  <label>
    Height:
    <input type="number" id="heightInput" value="11" min="1">
  </label>

  <button onclick="createGrid()">Create Grid</button>

  <button onclick="generateJSON()">Generate JSON</button>

  <button onclick="importJSON()">Import JSON</button>

</div>

<div id="mainContent">

  <!-- GRID -->
  <div id="gridContainer">
    <div id="grid"></div>
  </div>

  <!-- JSON -->
  <div id="jsonPanel">

    <h2>Generated Map</h2>

    <textarea id="output"></textarea>

  </div>

</div>

  <!-- TOOLBAR -->
  <div id="toolbar">

    <h2>Tiles</h2>

    <button class="toolButton selectedTool"
            style="background:white; color:black;"
            onclick="selectTile('____', 'white', this)">
      Empty
    </button>

    <button class="toolButton"
            style="background:gray;"
            onclick="selectTile('wall', 'gray', this)">
      Wall
    </button>

    <button class="toolButton"
            style="background:green;"
            onclick="selectTile('tree', 'green', this)">
      Tree
    </button>

    <button class="toolButton"
            style="background:blue;"
            onclick="selectTile('water', 'blue', this)">
      Water
    </button>

    <button class="toolButton"
            style="background:purple;"
            onclick="selectTile('nest', 'purple', this)">
      Nest
    </button>

    <button class="toolButton"
            style="background:orange;"
            onclick="selectTile('lava', 'orange', this)">
      Lava
    </button>

  </div>

  <script>

    // ROOM DATA
    let room = [];

    // CURRENT TILE
    let currentTile = "____";
    let currentColor = "white";

    // DRAG PAINTING
    let mouseDown = false;

    // TILE COLORS
    const tileColors = {
      "____": "white",
      "wall": "gray",
      "tree": "green",
      "water": "blue",
      "nest": "purple",
      "lava": "orange"
    };

    // TRACK MOUSE
    document.body.addEventListener("mousedown", () => {
      mouseDown = true;
    });

    document.body.addEventListener("mouseup", () => {
      mouseDown = false;
    });

    // SELECT TILE
    function selectTile(tileName, color, button) {

      currentTile = tileName;
      currentColor = color;

      const buttons = document.querySelectorAll(".toolButton");

      buttons.forEach(btn => {
        btn.classList.remove("selectedTool");
      });

      button.classList.add("selectedTool");
    }

    // PAINT TILE
    function paintTile(cell, x, y) {

      room[y][x] = currentTile;

      cell.style.background = currentColor;
    }

    // CREATE GRID
    function createGrid() {

      const width = parseInt(document.getElementById("widthInput").value);
      const height = parseInt(document.getElementById("heightInput").value);

      const grid = document.getElementById("grid");

      grid.innerHTML = "";

      room = [];

      // GRID LAYOUT
      grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${height}, 1fr)`;

      // CREATE CELLS
      for (let y = 0; y < height; y++) {

        room[y] = [];

        for (let x = 0; x < width; x++) {

          const cell = document.createElement("div");

          cell.classList.add("cell");

          // BORDER CHECK
          const isBorder =
            x === 0 ||
            y === 0 ||
            x === width - 1 ||
            y === height - 1;

          // OUTER WALLS
          if (isBorder) {

            room[y][x] = "wall";
            cell.style.background = "gray";

          } else {

            room[y][x] = "____";
            cell.style.background = "white";

          }

          // SINGLE CLICK
          cell.addEventListener("mousedown", () => {
            paintTile(cell, x, y);
          });

          // CLICK + DRAG
          cell.addEventListener("mouseover", () => {

            if (mouseDown) {
              paintTile(cell, x, y);
            }

          });

          grid.appendChild(cell);
        }
      }
    }

    // GENERATE JSON
    function generateJSON() {

      let output = "room = [\n";

      for (let y = 0; y < room.length; y++) {

        output += "    [";

        for (let x = 0; x < room[y].length; x++) {

          output += room[y][x];

          if (x < room[y].length - 1) {
            output += ",";
          }

        }

        output += "]";

        if (y < room.length - 1) {
          output += ",";
        }

        output += "\n";
      }

      output += "];";

      document.getElementById("output").value = output;
    }

    // IMPORT JSON
    function importJSON() {

      try {

        let text = document.getElementById("output").value;

        // Remove room =
        text = text.replace("room =", "").trim();

        // Remove semicolon
        text = text.replace(";", "");

        // Add quotes around tile names
        text = text.replace(/\b([a-zA-Z_]+)\b/g, '"$1"');

        // Parse
        const importedRoom = JSON.parse(text);

        room = importedRoom;

        const height = room.length;
        const width = room[0].length;

        // Update size inputs
        document.getElementById("widthInput").value = width;
        document.getElementById("heightInput").value = height;

        const grid = document.getElementById("grid");

        grid.innerHTML = "";

        // GRID LAYOUT
        grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
        grid.style.gridTemplateRows = `repeat(${height}, 1fr)`;

        // REBUILD GRID
        for (let y = 0; y < height; y++) {

          for (let x = 0; x < width; x++) {

            const cell = document.createElement("div");

            cell.classList.add("cell");

            const tile = room[y][x];

            // Set tile color
            cell.style.background =
              tileColors[tile] || "magenta";

            // Click paint
            cell.addEventListener("mousedown", () => {
              paintTile(cell, x, y);
            });

            // Drag paint
            cell.addEventListener("mouseover", () => {

              if (mouseDown) {
                paintTile(cell, x, y);
              }

            });

            grid.appendChild(cell);
          }
        }

      } catch (error) {

        alert("Invalid room data!");

        console.error(error);

      }
    }

    // START
    createGrid();

  </script>

</body>
</html>
