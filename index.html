<!DOCTYPE html>
<html>
<head>
  <title>Custom Grid</title>

  <style>
    body {
      font-family: Arial;
      display: flex;
      flex-direction: column;
      align-items: left;
      gap: 20px;
      margin-top: 20px;
    }

    #grid {
      display: grid;
      width: 600px;
      height: 600px;
      border: 2px solid black;
    }

    .cell {
      border: 1px solid #ccc;
      background-color: white;
    }

    .active {
      background-color: tomato;
    }
  </style>
</head>
<body>

  <h1>Custom Grid Generator</h1>

  <div>
    Width:
    <input type="number" id="widthInput" value="10" min="1">

    Height:
    <input type="number" id="heightInput" value="10" min="1">

    <button onclick="createGrid()">Create Grid</button>
  </div>

  <p>Clicked Cells: <span id="counter">0</span></p>

  <div id="grid"></div>

  <script>
    let clickedCount = 0;

    function createGrid() {

      const width = parseInt(document.getElementById("widthInput").value);
      const height = parseInt(document.getElementById("heightInput").value);

      const grid = document.getElementById("grid");

      // Reset grid
      grid.innerHTML = "";
      clickedCount = 0;
      document.getElementById("counter").textContent = clickedCount;

      // Create columns and rows
      grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${height}, 1fr)`;

      // Total cells
      const totalCells = width * height;

      for (let i = 0; i < totalCells; i++) {

        const cell = document.createElement("div");
        cell.classList.add("cell");

        cell.addEventListener("click", () => {

          if (!cell.classList.contains("active")) {
            cell.classList.add("active");
            clickedCount++;
          } else {
            cell.classList.remove("active");
            clickedCount--;
          }

          document.getElementById("counter").textContent = clickedCount;
        });

        grid.appendChild(cell);
      }
    }

    // Create starting grid
    createGrid();
  </script>

</body>
</html>
